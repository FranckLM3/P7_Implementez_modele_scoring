[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-scoring"
version = "0.1.0"
description = "Credit scoring model with LightGBM - OpenClassrooms P7"
readme = "README.md"
authors = [{ name = "Franck Le Mat" }]
requires-python = ">=3.9"
dependencies = [
  "pandas>=2.2",
  "numpy>=2.0",
  "scikit-learn>=1.5",
  "lightgbm>=4.5",
  "joblib>=1.3",
  "matplotlib>=3.8",
  "seaborn>=0.13",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
